<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="https://code.jquery.com/jquery-3.5.0.min.js"
            integrity="sha256-xNzN2a4ltkB44Mc/Jz3pT4iU1cmeR0FkXs4pru/JxaQ=" 
            crossorigin="anonymous">
        </script>
        <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    </head>
    <body>
        <div class="main">
            
            <div class="header">
                <div class="option">
                    <button id="armamentos" class="active" onclick="active(this);armamentos()">ARMAMENTOS</button>
                    <button class="armamentos" onclick="active(this);guardar()">GUARDAR ARMAS</button>
                    <button class="armamentos" onclick="active(this);guardarColete()">GUARDAR COLETE</button>
                </div>
                <button class="fechar" onclick="fechar()">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>

            <div class="quadrado-main">

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Glock</p>
                        <p class="info">Munições: 200</p> 
                    </div>
                    <img class="i-q" src="https://cdn.discordapp.com/attachments/994263910926528532/1265009054015815771/pistol.png?ex=669ff2fd&is=669ea17d&hm=e9bfdb49d7e9bd057ac9f6f1e778b37e019c409a15d1294b1cafa3da84af29fe&" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar" onclick="equipar(`glock`)">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Deagle</p>
                        <p class="info">Munições: 200</p> 
                    </div>
                    <img class="i-q" src="https://media.discordapp.net/attachments/994263910926528532/1265009067395383389/pistol50.png?ex=669ff300&is=669ea180&hm=b9c7b7f8ab2ceff94d2b1b6ae9198fd92658c8a2ff4c0c72646b59587d4a4572&=&format=webp&quality=lossless&width=466&height=350" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar"  onclick="equipar(`desert`)">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">MPX</p>
                        <p class="info">Munições: 200</p> 
                    </div>
                    <img class="i-q" src="https://media.discordapp.net/attachments/994263910926528532/1265010224985673790/mpx.png?ex=669ff414&is=669ea294&hm=f8b06847e264c08f0843204f1b114d8a02f6ddf9319e4f17ae12ba6fcb4d044b&=&format=webp&quality=lossless" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar" onclick="equipar(`mpx`)" ">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Carbine Rifle</p>
                        <p class="info">Munições: 200</p> 
                    </div>
                    <img class="i-q" src="https://cdn.discordapp.com/attachments/994263910926528532/1265009135481786491/m4.png?ex=669ff310&is=669ea190&hm=8b68794836519bcf995205de43b26dca2a908d2dd37c16e0af8a74b081c802e0&" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar" onclick="equipar(`scar`)">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Sig Sauer</p>
                        <p class="info">Munições: 200</p> 
                    </div>
                    <img class="i-q" src="https://cdn.discordapp.com/attachments/994263910926528532/1265015123089817711/sigsauer.png?ex=669ff8a4&is=669ea724&hm=06b105597b5f4f2e716d907cf26ca6a76ac377eeb5541e294079b1d13dc7ce47&" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar" onclick="equipar(`sig`)">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Shotgun</p>
                        <p class="info">Munições: 200</p> 
                    </div>
                    <img class="i-q" src="https://media.discordapp.net/attachments/994263910926528532/1265009100044107828/shotgun_mk2.png?ex=669ff308&is=669ea188&hm=ecd93a96c2a9cbaec7a6feda689312c03b907650e86a70a4b0ce7450942f8a13&=&format=webp&quality=lossless&width=550&height=114" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar" onclick="equipar(`shotgun`)">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Kit</p>
                        <p class="info">Rádio, Badagem & Energético</p> 
                    </div>
                    <img class="i-q" src="https://cdn.discordapp.com/attachments/994263910926528532/1265010465227018291/mochila.png?ex=669ff44d&is=669ea2cd&hm=eaac752bbb5a2e4ae86ad38f9f00863b79c2d1a0905f44845f11abdc9d6820dc&" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar"onclick="equipar(`kit`)">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Colete</p>
                        <p class="info">Proteção nunca é demais!</p> 
                    </div> 
                    <img class="i-q" src="https://cdn.discordapp.com/attachments/994263910926528532/1265009146697355484/colete.png?ex=669ff313&is=669ea193&hm=90fa792ffdd55bf861b7a98fda5d9430b0b983e177a59528273345d58db7705d&" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar"onclick="colete()">EQUIPAR</button>
                    </div>
                </div>

                <div class="quadrado">
                    <div class="header-q">
                        <p class="q-text">Tazer</p>
                        <p class="info">Use com moderação (ou não)</p> 
                    </div> 
                    <img class="i-q" src="https://cdn.discordapp.com/attachments/994263910926528532/1265009121548042250/teazer.png?ex=669ff30d&is=669ea18d&hm=eee2c0a240e71be25431cdf2bf8ad9881edc33fc6db14c530a6fee96a4c36da8&" style="width: 8vw;">
                    <div class="buttons">
                        <button class="equipar"onclick="equipar(`taser`)">EQUIPAR</button>
                    </div>
                </div>

            </div>
            <div class="favoritos-main" style="display: none;"></div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
